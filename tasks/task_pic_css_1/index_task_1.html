    <body>
        <!-- верхняя полоска (тёмная) -->
        <div class="topbar">
            <div class="container topbar_inner">
                <span class="topbar_text">Корешок</span>
                <span class="topbar_meta">Дневник современного читателя</span>
            </div>
        </div>

        <!-- верхняя полоска (шапка с меню) -->
         <header class="header">
            <div class="container header_inner">
                <nav class="nav" aria-label="Основная навигация">
                    <ul class="nav_list">

        <!-- синтаксис задания -->
        <main class="task">
            <div class="container">
                <div class="task_demo">
                    <!-- отрисовка css-изображения -->
                    <div class="picture">
                        <!-- облака -->
                        <div class="cloud cloud-1"></div>
                        <div class="cloud cloud-2"></div>

                        <!-- грибы -->
                        <div class="mushroom mushroom-big">
                            <div class="stem"></div>
                            <div class="cap"></div>
                        </div>

                        <div class="mushroom mushroom-small">
                            <div class="stem"></div>
                            <div class="cap"></div>
                        </div>

                        <!-- трава -->
                        <div class="grass grass-1"></div>
                        <div class="grass grass-2"></div>
                        <div class="grass grass-3"></div>
                        <div class="grass grass-4"></div>

                        <!-- стрекоза -->
                        <div class="dragonfly">
                            <div class="wing wing-top-left"></div>
                            <div class="wing wing-top-right"></div>
                            <div class="wing wing-bottom-left"></div>
                            <div class="wing wing-bottom-right"></div>

                            <div class="body"></div>
                            <div class="head">
                                <div class="eye eye-left"></div>
                                <div class="eye eye-right"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
